<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diff-notes</title>
    <link rel="stylesheet" href="/review.css" />
  </head>
  <body>
    <header>
      <h1>diff-notes</h1>
      <span class="meta" id="meta"></span>
      <span class="spacer"></span>
      <span class="meta" id="tally">0 comments</span>
      <button class="primary" id="send">Send to Claude</button>
    </header>
    <main>
      <p class="hint">
        Click any line to add a note, <kbd>Shift</kbd>+click to select a range, right-click for
        more. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves a note. When you're done, send everything back
        to the Claude Code session.
      </p>
      <div id="files"></div>
    </main>
    <!-- The server replaces the placeholder below with the parsed diff as JSON. -->
    <script id="diff-data" type="application/json">
      __DIFF_DATA__
    </script>
    <script type="module" src="/review.js"></script>
  </body>
</html>
